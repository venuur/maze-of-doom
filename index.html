<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Maze of Doom</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0b0910; color: #d9d3e6;
        font: 14px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        padding: 16px; touch-action: none; user-select: none;
      }
      header { width: min(960px, 100%); display: flex; justify-content: space-between; opacity: 0.85; }
      #frame { position: relative; width: min(960px, 100%); aspect-ratio: 15 / 11; }
      canvas { width: 100%; height: 100%; image-rendering: pixelated; border: 2px solid #2a2534; border-radius: 4px; display: block; }
      #message {
        position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
        width: calc(100% - 32px); max-width: 640px; padding: 10px 14px;
        background: rgba(11, 9, 16, 0.88); border: 1px solid #4a4458; border-radius: 4px;
        opacity: 0; transition: opacity 200ms; pointer-events: none;
      }
      #message.show { opacity: 1; }
      #pad { display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
      #pad button { background: #2a2534; color: #d9d3e6; border: 1px solid #4a4458; border-radius: 6px; font-size: 20px; touch-action: none; }
      @media (pointer: coarse) { #pad { display: grid; } }
      .hint { opacity: 0.5; font-size: 12px; }
      #party { width: min(960px, 100%); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
      #party .m { display: inline-flex; align-items: center; gap: 6px; }
      #party .bar { width: 48px; height: 5px; background: #000; border-radius: 3px; overflow: hidden; }
      #party .bar i { display: block; height: 100%; background: #5fc46a; }
      #party .down { opacity: 0.45; text-decoration: line-through; }
      #battle-layer { position: fixed; inset: 0; z-index: 10; overflow: auto; background: #0b0910; padding: 16px; touch-action: auto; user-select: text; }
      #battle-layer > .bv { max-width: 980px; margin: 0 auto; }
      #battle-layer h1 { font-size: 16px; margin: 0; }
      #frame.flash canvas { animation: flash 450ms steps(6) forwards; }
      @keyframes flash {
        0% { filter: none; transform: scale(1); }
        50% { filter: invert(1) hue-rotate(180deg); transform: scale(1.04); }
        100% { filter: brightness(0); transform: scale(1.12); }
      }
    </style>
  </head>
  <body>
    <header><span id="zone-name">…</span><span class="hint">Arrows / WASD to move · <a href="battle.html" style="color:#4a9ad8">battle sandbox →</a></span></header>
    <div id="party"></div>
    <div id="frame">
      <canvas id="game"></canvas>
      <div id="message"></div>
    </div>
    <div id="pad">
      <span></span><button data-dir="up">▲</button><span></span>
      <button data-dir="left">◀</button><span></span><button data-dir="right">▶</button>
      <span></span><button data-dir="down">▼</button><span></span>
    </div>
    <div id="battle-layer" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
