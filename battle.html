<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Sandbox</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b0910; color: #d9d3e6; font: 14px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace; }
      main { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
      header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
      header h1 { font-size: 16px; margin: 0 auto 0 0; }
      a { color: #4a9ad8; }
      .bv { display: grid; gap: 12px; }
      @media (max-width: 560px) { main { padding: 12px; } }
    </style>
  </head>
  <body>
    <main class="bv">
      <header>
        <h1>Maze of Doom: Battle Sandbox</h1>
        <select id="encounter"></select>
        <select id="party" title="Party preset">
          <option value="start">Starting party (Lv1)</option>
          <option value="lv2">Party Lv2</option>
          <option value="veteran">Veteran (max level)</option>
          <option value="hybrid">Veteran + Spellblade</option>
        </select>
        <label>seed <input id="seed" type="number" value="1" style="width: 80px" /></label>
        <button id="reset">Reset</button>
        <a href="./">overworld →</a>
      </header>
      <div id="battle"></div>
    </main>
    <script type="module" src="/src/battle/sandbox.ts"></script>
  </body>
</html>
